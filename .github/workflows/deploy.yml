name: Test release review (manual, no server execution)
'on':
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed commit SHA; never a moving branch or tag
        required: true
        type: string
      target:
        description: Only permitted test target
        required: true
        type: choice
        options: [test.edaratek.com]
      approve_test_handoff:
        description: Request protected-environment review of the test release bundle
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: edaratek-test-release-review
  cancel-in-progress: false
jobs:
  validate:
    if: inputs.approve_test_handoff && inputs.target == 'test.edaratek.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify exact requested revision
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Disposable Linux security and full regression gate
        shell: pwsh
        run: ./tools/testing/run-tests.ps1 -SecurityGate
  package:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Create immutable source review bundle
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: python3 tools/release/review_bundle.py create --sha "$REQUESTED_SHA" --directory "$RUNNER_TEMP/edaratek-review"
      - name: Verify bundle rejection rules
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: bundle
        with:
          name: edaratek-test-source-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/edaratek-review/*
          if-no-files-found: error
          retention-days: 7
  approved_test_handoff:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    environment:
      name: edaratek-test
      url: https://test.edaratek.com
    steps:
      - name: Require configured environment reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/environments/edaratek-test" --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' | grep -qx true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/edaratek-review
          merge-multiple: true
      - name: Verify approved bundle and frozen-baseline approval
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          python3 tools/release/review_bundle.py verify --sha "$REQUESTED_SHA" --directory "$RUNNER_TEMP/edaratek-review"
          docker run --rm --network none -v "$PWD:/src:ro" php:8.2-cli-bookworm@sha256:26b388d187a5e592ef5e02c14d0f92dd9c761894ff0a5fe338183196471c4b4e php /src/tools/testing/verify-security-candidate.php release /src
      - name: Test-only operator handoff
        run: |
          echo 'Verified source review bundle for test.edaratek.com only.'
          echo 'No SSH, deployment, service credential, migration or server operation is configured.'
          echo 'Follow docs/EDARATEK_SECURITY_REMEDIATION.md after separate PM deployment authorization.'
