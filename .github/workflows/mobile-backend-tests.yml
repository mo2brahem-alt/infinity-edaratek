name: Isolated mobile backend baseline
'on':
  push:
    branches:
      - ci/mobile-backend-baseline
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/mobile-backend-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Guarded disposable MySQL baseline
        shell: pwsh
        run: ./tools/testing/run-tests.ps1
# Node 22.23.4 is digest-pinned in the Docker frontend stage (Vite requires
# ^20.19.0 || >=22.12.0). npm ci + npm run build run there without host .env.
# Only sanitized JSON is logged. No raw JUnit/log/storage artifact is uploaded.
# No main/PR/schedule trigger, deployment, shared environment or provider secrets.
# Branch creation/commit/push still require separate PM approval.
